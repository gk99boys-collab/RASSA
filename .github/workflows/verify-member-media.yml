name: Verify member image uploads
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'src/admin/**'
      - 'src/lib/memberMedia.ts'
      - 'tests/storage-local.mjs'
      - '.github/workflows/verify-member-media.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2
        with:
          version: 2.122.1
      - name: Start disposable local Supabase (no project link or hosted keys)
        run: |
          mkdir "$RUNNER_TEMP/media-fixture"
          cd "$RUNNER_TEMP/media-fixture"
          supabase init
          supabase start -x studio,imgproxy,edge-runtime,realtime,logflare,vector,postgres-meta,mailpit,supavisor >/dev/null
      - name: Check real Storage, PostgREST and RLS together
        run: supabase status --workdir "$RUNNER_TEMP/media-fixture" -o json | node tests/storage-local.mjs
